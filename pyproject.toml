[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daily-kotoba"
version = "0.1.0"
description = "Serves one Japanese word per day, rendered to a 1-bit PNG for an ESPHome e-paper display."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "pydantic-settings",
    "pillow",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/daily_kotoba"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901"]
# Catches complexity drift locally instead of waiting for Sonar to flag it on a PR.
# Cyclomatic, not Sonar's cognitive metric, but close enough to be an early warning.
mccabe = { max-complexity = 10 }

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in argument defaults is the idiomatic pattern, not a bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
